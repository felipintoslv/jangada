# Claude implementa no worktree do jangada; o Codex revisa o diff e as
# delegações vão ao agy.
# Uso: jangada-agente --perfil claude-codex --nome TAREFA --prompt "..."
# Uma cópia em ~/.config/jangada/agentes/claude-codex.conf tem precedência.
COMANDO=claude
DESCRICAO=Claude implementa, Codex revisa; delegações ao agy
JANGADA_VALIDAR_REVISOR=codex
JANGADA_DELEGAR=agy
