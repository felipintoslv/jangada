# Codex implementa no worktree do jangada; o Claude revisa o diff e as
# delegações vão ao agy.
# Uso: jangada-agente --perfil codex-claude --nome TAREFA --prompt "..."
# Uma cópia em ~/.config/jangada/agentes/codex-claude.conf tem precedência.
COMANDO=codex
DESCRICAO=Codex implementa, Claude revisa; delegações ao agy
JANGADA_VALIDAR_REVISOR=claude
JANGADA_DELEGAR=agy
# Piloto explícito: --autor-modelo gpt-6.1-sol (high) ou gpt-6-luna (medium).
# A seleção por tarefa fixa o revisor independente em Opus high.
