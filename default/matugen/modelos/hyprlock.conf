# Gerado pelo jangada-tema (matugen). Não edite: será sobrescrito.
# hyprlock ainda usa o formato hyprlang (.conf).

general {
    hide_cursor = true
}

background {
    path = {{image}}
    color = rgb({{colors.surface.default.hex_stripped}})
    blur_passes = 1
    blur_size = 3
}

input-field {
    size = 320, 50
    position = 0, -40
    halign = center
    valign = center
    outline_thickness = 2
    outer_color = rgb({{colors.primary.default.hex_stripped}})
    inner_color = rgb({{colors.surface_container.default.hex_stripped}})
    font_color = rgb({{colors.on_surface.default.hex_stripped}})
    fail_color = rgb({{colors.error.default.hex_stripped}})
    placeholder_text = senha
    fade_on_empty = false
}

label {
    text = $TIME
    font_size = 64
    color = rgb({{colors.on_surface.default.hex_stripped}})
    position = 0, 80
    halign = center
    valign = center
}
