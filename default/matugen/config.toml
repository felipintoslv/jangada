# Configuração do matugen usada pelo jangada-tema.
# Caminhos de entrada são relativos a este arquivo; os de saída vão para
# ~/.config/jangada. Os comandos de recarga ficam no jangada-tema, não aqui.

[config]
version_check = false
fallback_color = "#4f8fba"
prefer = "saturation"

[templates.hypr]
input_path = "./modelos/hypr.lua"
output_path = "~/.config/jangada/hypr/cores.lua"

[templates.waybar]
input_path = "./modelos/waybar.css"
output_path = "~/.config/jangada/waybar/cores.css"

[templates.mako]
input_path = "./modelos/mako"
output_path = "~/.config/jangada/mako/config"

[templates.fuzzel]
input_path = "./modelos/fuzzel.ini"
output_path = "~/.config/jangada/fuzzel/fuzzel.ini"

[templates.hyprlock]
input_path = "./modelos/hyprlock.conf"
output_path = "~/.config/jangada/hyprlock/hyprlock.conf"

[templates.ghostty]
input_path = "./modelos/ghostty"
output_path = "~/.config/jangada/ghostty/cores"

[templates.sddm]
input_path = "./modelos/sddm.conf"
output_path = "~/.config/jangada/sddm/theme.conf.user"

[templates.fichas]
input_path = "./modelos/fichas.json"
output_path = "~/.config/jangada/fichas.json"
