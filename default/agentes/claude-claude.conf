# Perfil do Claude Code com auto-revisão no fluxo do jangada: o Claude
# implementa e uma instância isolada do Claude (claude -p) revisa o diff.
# Não requer o agy instalado. Abra com: jangada-agente --perfil claude-claude --nome TAREFA --prompt "..."
#
# Para mudar os argumentos ou modelo, copie para ~/.config/jangada/agentes/claude-claude.conf
# (a cópia do usuário tem precedência).

COMANDO=claude
DESCRICAO=Claude implementa, o Claude revisa; usa apenas o Claude
JANGADA_VALIDAR_REVISOR=claude
