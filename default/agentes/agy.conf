# Perfil do Antigravity (agy) no fluxo do jangada: o agy pesquisa e
# implementa, e o jangada-validar chama o Claude (claude -p) só para revisar o
# diff. É a opção que mais economiza tokens do Claude. Abra com: jangada-agente --perfil agy --nome TAREFA --prompt "..."
#
# Para mudar o esforço ou o modelo, copie para ~/.config/jangada/agentes/agy.conf
# (a cópia do usuário tem precedência).

COMANDO=agy
DESCRICAO=agy implementa, o Claude só revisa o diff; economiza mais tokens do Claude
ARGS=--effort high
