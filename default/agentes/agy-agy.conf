# Perfil do Antigravity (agy) com autorrevisão no fluxo do jangada: o agy
# implementa e uma instância isolada do agy revisa o diff. Não consome
# tokens do Claude. Abra com: jangada-agente --perfil agy-agy --nome TAREFA --prompt "..."
#
# Para mudar o esforço ou o modelo, copie para ~/.config/jangada/agentes/agy-agy.conf
# (a cópia do usuário tem precedência).

COMANDO=agy
DESCRICAO=agy implementa e revisa; autorrevisão pelo mesmo provedor
ARGS=--effort high
JANGADA_VALIDAR_REVISOR=agy
JANGADA_DELEGAR=nativo
