# Preferências do jangada. Formato CHAVE=valor, sem espaços ao redor do "=".
# Lido pelos comandos jangada-* e pela configuração do Hyprland.

# Interface da sessão: "componentes" (waybar, fuzzel, mako) ou "noctalia"
# (usa o Noctalia já instalado como barra, lançador e notificações).
JANGADA_INTERFACE=componentes

# Terminal: ghostty, kitty, foot ou alacritty. Vazio escolhe o primeiro instalado.
JANGADA_TERMINAL=

# Comando do agente padrão e argumentos extras.
JANGADA_AGENTE=claude
JANGADA_AGENTE_ARGS=

# Modelos do agy na delegação (jangada-delegar), em ordem de tentativa: o
# seguinte entra quando a cota do anterior acaba. Os gemini-* dividem uma
# cota; os demais (Claude e GPT servidos pelo agy), outra. Lista: agy models.
#JANGADA_DELEGAR_MODELOS=gemini-3.8-flash-high claude-sonnet-5-5-high gpt-oss-120b-medium

# Modelo econômico escolhido pelo usuário. Vazio desabilita o executor Codex.
# O executor nunca escolhe outro modelo. A cota pode ser compartilhada com o principal.
JANGADA_CODEX_ECONOMICO_MODELO=
# Modelo explícito para executar análise principal documental; vazio desativa.
JANGADA_CODEX_PRINCIPAL_MODELO=
JANGADA_CODEX_COTA_MIN=25

# Onde ficam os projetos (usado pelo seletor) e os worktrees dos agentes.
JANGADA_PROJETOS=$HOME/Projetos
JANGADA_WORKTREES=$HOME/.local/share/jangada-worktrees

# Papel de parede atual (atualizado por jangada-tema).
JANGADA_PAPEL=

# Como o papel de parede ocupa uma tela de proporção diferente da imagem, por
# exemplo uma imagem 16:9 num monitor 21:9. "espelho" mostra a figura inteira
# e completa as laterais com o reflexo da borda; "desfoque" completa com a
# própria imagem ampliada e desfocada; "cor" completa com a cor de fundo do
# tema; "cobrir" amplia até cobrir a tela e corta o excesso. Vale para a área
# de trabalho, o bloqueio de tela e a tela de login.
JANGADA_PAPEL_AJUSTE=espelho

# Esquema do matugen usado pelo jangada-tema. scheme-fidelity mantém a cor da
# imagem; scheme-tonal-spot, o padrão do matugen, puxa a saturação e pode
# transformar um creme em dourado. Os demais: scheme-content,
# scheme-expressive, scheme-neutral, scheme-monochrome, scheme-vibrant.
JANGADA_TEMA_ESQUEMA=scheme-fidelity

# Dispositivo DRM que conduz a sessão, um só, em caminho estável. Vazio faz o
# jangada escolher a placa que tem monitor ligado, o que é o certo na maioria
# das máquinas. Preencha só para forçar outra; veja os caminhos com
# "ls /dev/dri/by-path". A sessão resolve esse caminho para o /dev/dri/cardN
# antes de passar ao compositor. Exemplo:
# JANGADA_GPU=/dev/dri/by-path/pci-0000:01:00.0-card
JANGADA_GPU=

# Borda em que a barra fica: topo, base, esquerda ou direita. Gravado pelo
# comando jangada-barra --posicao.
JANGADA_BARRA_POSICAO=topo

# Ramo que o jangada-update acompanha na cópia instalada: main (tudo o que
# entrou) ou estavel (versões testadas e marcadas).
JANGADA_CANAL=main

# Revisor padrão global para jangada-validar: claude, agy, codex ou mesmo.
# Vazio respeita o revisor da sessão; sem ele, Claude e Codex revisam um ao outro.
JANGADA_VALIDAR_REVISOR=

# Agente dentro do bubblewrap (jangada-isolar): 1 liga, 0 desliga. Um perfil
# pode desligar só para si com JANGADA_AGENTE_ISOLAR=0, e uma sessão com
# jangada-agente --sem-isolar. Na restauração (jangada-agentes --restaurar)
# vale só este valor: perfil e --sem-isolar ficam de fora, e a sessão volta
# isolada.
JANGADA_AGENTE_ISOLAR=1

# Pastas a mais que o agente isolado pode gravar, separadas por ":". Exemplo:
# JANGADA_ISOLAR_ESCRITA=~/dados:~/R
# Lista de pastas e arquivos ocultos ao agente, relativos à pasta pessoal ou
# absolutos, separados por ":". Definida, substitui a lista padrão (.ssh,
# .gnupg, credenciais, perfis de navegador); vazia, não oculta nada.
# JANGADA_ISOLAR_OCULTAR=.ssh:.gnupg:.aws
# Para acrescentar caminhos sem perder a lista padrão:
# JANGADA_ISOLAR_OCULTAR_EXTRA=.config/minha-ferramenta:~/segredos
# O .jangada/validar.sh do projeto roda sem rede na validação. Se ele precisa
# de rede (as credenciais dos provedores seguem ocultas):
# JANGADA_VALIDAR_REDE=1
# Casa mínima: a pasta pessoal aparece vazia para o agente, e só volta,
# somente leitura, o que os agentes e o jangada usam (executáveis do PATH,
# configuração do git, pastas do Claude, agy e Codex). O que o
# projeto precisa ler a mais entra em JANGADA_ISOLAR_CASA_LER, separado por ":".
# JANGADA_ISOLAR_CASA=minima
# JANGADA_ISOLAR_CASA_LER=~/R:~/.Renviron:~/dados
# O mesmo para o ambiente: só passam as variáveis do sistema, do jangada e dos
# agentes. As que o projeto usa entram em JANGADA_ISOLAR_AMBIENTE_MANTER.
# JANGADA_ISOLAR_AMBIENTE=minimo
# JANGADA_ISOLAR_AMBIENTE_MANTER=R_LIBS_USER:JAVA_HOME
# Keyring por item: com o agy instalado, o agente só lê do keyring os itens
# com estes atributos (pares atributo=valor separados por espaço). Sem a
# opção, o serviço inteiro fica liberado. Ver docs/isolamento.md.
# JANGADA_ISOLAR_KEYRING_ITEM=service=NOME username=USUARIO

# Cópia de trabalho do repositório jangada (onde se edita e faz commit), usada
# por jangada-verificar --agente. Vazio busca $JANGADA_PROJETOS/jangada ou a
# origem remota local da cópia instalada.
JANGADA_REPO=

# Chave SSH com que o jangada-assinar assina os commits da cópia de trabalho
# (a pública fica ao lado, com .pub). Com ~/.config/jangada/allowed_signers,
# o jangada-update só aplica commits assinados por uma chave desse arquivo.
JANGADA_ASSINATURA_CHAVE=~/.ssh/id_ed25519

# Quantos snapshots do jangada-agente --snapshot ficam guardados. Eles ficam
# fora da limpeza por número do snapper, para não empurrar para fora os
# snapshots das atualizações, e o jangada-snapshot apaga os mais antigos.
JANGADA_SNAPSHOTS_AGENTE=5

# Dias de detalhe no cache do jangada-painel (respostas, chamadas e
# resultados de ferramentas). Os dias mais antigos saem; o consumo deles
# fica somado por dia, projeto e modelo. 0 guarda tudo.
JANGADA_PAINEL_RETENCAO=180
