# Preferências do jangada. Formato CHAVE=valor, sem espaços ao redor do "=".
# Lido pelos comandos jangada-* e pela configuração do Hyprland.

# Interface da sessão: "componentes" (waybar, fuzzel, mako) ou "noctalia"
# (usa o Noctalia já instalado como barra, lançador e notificações).
JANGADA_INTERFACE=componentes

# Terminal: ghostty, kitty, foot ou alacritty. Vazio escolhe o primeiro instalado.
JANGADA_TERMINAL=

# Comando do agente padrão e argumentos extras.
JANGADA_AGENTE=claude
JANGADA_AGENTE_ARGS=

# Onde ficam os projetos (usado pelo seletor) e os worktrees dos agentes.
JANGADA_PROJETOS=$HOME/Projetos
JANGADA_WORKTREES=$HOME/.local/share/jangada-worktrees

# Papel de parede atual (atualizado por jangada-tema).
JANGADA_PAPEL=
