name: verificar

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  verificar:
    strategy:
      fail-fast: false
      matrix:
        include:
          # "fixo" repete sempre os mesmos pacotes: imagem por digest e
          # repositórios do Arch Linux Archive na data dela. "atual" acompanha
          # as atualizações e acusa quebra nova.
          - ambiente: fixo
            imagem: archlinux@sha256:b21322c663be387c0ed9cbc7bbbfe18e41633ad4e7b7c77cfad45f128be20040
            arquivo: 2026/09/27
          - ambiente: atual
            imagem: archlinux:latest
            arquivo: ""
    name: verificar (${{ matrix.ambiente }})
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.imagem }}
      # O bwrap precisa criar namespaces, e o Docker barra isso por padrão.
      options: --privileged
    steps:
      - name: Repositórios da data fixa
        if: matrix.arquivo != ''
        run: echo 'Server = https://archive.archlinux.org/repos/${{ matrix.arquivo }}/$repo/os/$arch' >/etc/pacman.d/mirrorlist

      # O runner Ubuntu barra pelo AppArmor o namespace de usuário sem
      # privilégio, e o bwrap do usuário de teste precisa dele.
      - name: Namespaces de usuário
        run: |
          f=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          [ ! -e "$f" ] || echo 0 >"$f"

      # R e lintr ficam no job sandbox-e2e: compilar o lintr leva minutos.
      - name: Dependências
        run: pacman -Syu --noconfirm --needed git sudo shellcheck lua jq python python-pyqt6 qt6-svg qt6-declarative gitleaks bubblewrap diffutils openssh xdg-dbus-proxy dbus python-dbus python-gobject zsh poppler python-pyarrow

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Sem o isolamento de verdade, o teste reprova em vez de pular.
      - name: Testes
        run: |
          useradd -m testes
          chown -R testes:testes "$GITHUB_WORKSPACE"
          runuser -u testes -- env GIT_CONFIG_GLOBAL=/tmp/jangada-ci-gitconfig JANGADA_TESTES_EXIGIR_ISOLAMENTO=1 \
            JANGADA_TESTES_EXIGIR="bwrap sem-rede shellcheck jq gitleaks zsh pdftotext pyarrow" sh -ec '
            git config --global user.name ci
            git config --global user.email ci@localhost
            testes/verificar.sh
          '

      # O install.sh recusa root e exige o sudo instalado. O usuário ci não
      # tem permissão no sudo, então qualquer escrita real fora do HOME falha,
      # e o HOME novo precisa sair vazio.
      - name: Simulação da instalação
        run: |
          useradd -m ci
          hash_antes="$(sha256sum /home/ci/.bash* 2>/dev/null || true)"
          runuser -u ci -- env HOME=/home/ci JANGADA_SIMULAR=1 "$GITHUB_WORKSPACE/install.sh" </dev/null
          hash_depois="$(sha256sum /home/ci/.bash* 2>/dev/null || true)"
          if [ "$hash_antes" != "$hash_depois" ]; then
            echo "a simulação alterou arquivos .bash* no HOME"
            exit 1
          fi
          sobras="$(find /home/ci -mindepth 1 -not -name '.bash*' -print -quit)"
          if [ -n "$sobras" ]; then
            echo "a simulação escreveu em $sobras"
            exit 1
          fi

  # O isolamento de verdade com o que o job acima deixa de fora: R e lintr.
  # Sem eles, o .lintr malicioso e o lintr dentro do bwrap ficam sem teste.
  sandbox-e2e:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      # O runner Ubuntu barra pelo AppArmor o namespace de usuário sem
      # privilégio, e o bwrap do usuário de teste precisa dele.
      - name: Namespaces de usuário
        run: |
          f=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          [ ! -e "$f" ] || echo 0 >"$f"

      - name: Dependências
        run: pacman -Syu --noconfirm --needed git sudo jq python gitleaks bubblewrap diffutils openssh xdg-dbus-proxy dbus zsh poppler r gcc make gcc-fortran libxml2 pkgconf

      - name: lintr
        # O xml2 precisa do pkg-config para localizar os cabeçalhos do libxml2.
        # install.packages pode apenas avisar da falha e terminar com código 0.
        run: |
          pkg-config --cflags --libs libxml-2.0
          Rscript -e 'install.packages("lintr", repos = "https://cloud.r-project.org", Ncpus = 4); library(lintr)'

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Testes do isolamento e da validação
        run: |
          useradd -m testes
          chown -R testes:testes "$GITHUB_WORKSPACE"
          runuser -u testes -- env GIT_CONFIG_GLOBAL=/tmp/jangada-ci-gitconfig JANGADA_TESTES_EXIGIR_ISOLAMENTO=1 \
            JANGADA_TESTES_EXIGIR="bwrap sem-rede jq gitleaks zsh R lintr" sh -ec '
            git config --global user.name ci
            git config --global user.email ci@localhost
            testes/capacidades.sh
            testes/isolar.sh
            testes/validar.sh
            testes/fim.sh
          '
