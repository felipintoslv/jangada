name: verificar

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  verificar:
    strategy:
      fail-fast: false
      matrix:
        include:
          # "fixo" repete sempre os mesmos pacotes: imagem por digest e
          # repositórios do Arch Linux Archive na data dela. "atual" acompanha
          # as atualizações e acusa quebra nova.
          - ambiente: fixo
            imagem: archlinux@sha256:b21322c663be387c0ed9cbc7bbbfe18e41633ad4e7b7c77cfad45f128be20040
            arquivo: 2026/09/27
          - ambiente: atual
            imagem: archlinux:latest
            arquivo: ""
    name: verificar (${{ matrix.ambiente }})
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.imagem }}
      # O bwrap precisa criar namespaces, e o Docker barra isso por padrão.
      options: --privileged
    steps:
      - name: Repositórios da data fixa
        if: matrix.arquivo != ''
        run: echo 'Server = https://archive.archlinux.org/repos/${{ matrix.arquivo }}/$repo/os/$arch' >/etc/pacman.d/mirrorlist

      # R e lintr ficam de fora: compilar o lintr leva minutos, e o caso 12 do
      # testes/validar.sh se pula sozinho sem eles.
      - name: Dependências
        run: pacman -Syu --noconfirm --needed git sudo shellcheck lua jq python python-pyqt6 qt6-declarative gitleaks bubblewrap diffutils openssh

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Sem o isolamento de verdade, o teste reprova em vez de pular.
      - name: Testes
        run: |
          useradd -m testes
          chown -R testes:testes "$GITHUB_WORKSPACE"
          runuser -u testes -- env GIT_CONFIG_GLOBAL=/tmp/jangada-ci-gitconfig JANGADA_TESTES_EXIGIR_ISOLAMENTO=1 sh -ec '
            git config --global user.name ci
            git config --global user.email ci@localhost
            testes/verificar.sh
          '

      # O install.sh recusa root e exige o sudo instalado. O usuário ci não
      # tem permissão no sudo, então qualquer escrita real fora do HOME falha,
      # e o HOME novo precisa sair vazio.
      - name: Simulação da instalação
        run: |
          useradd -m ci
          hash_antes="$(sha256sum /home/ci/.bash* 2>/dev/null || true)"
          runuser -u ci -- env HOME=/home/ci JANGADA_SIMULAR=1 "$GITHUB_WORKSPACE/install.sh" </dev/null
          hash_depois="$(sha256sum /home/ci/.bash* 2>/dev/null || true)"
          if [ "$hash_antes" != "$hash_depois" ]; then
            echo "a simulação alterou arquivos .bash* no HOME"
            exit 1
          fi
          sobras="$(find /home/ci -mindepth 1 -not -name '.bash*' -print -quit)"
          if [ -n "$sobras" ]; then
            echo "a simulação escreveu em $sobras"
            exit 1
          fi
