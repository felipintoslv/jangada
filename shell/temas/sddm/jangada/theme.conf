# Valores padrão do tema de login do jangada, com as cores que o papel de
# parede cordel gera. O jangada-sddm grava ao lado um theme.conf.user com as
# cores do jangada-tema (modelo default/matugen/modelos/sddm.conf) e o papel
# de parede atual; o SDDM lê esse arquivo depois deste, então os valores de lá
# prevalecem.
# Cores em #RRGGBB ou #AARRGGBB (formato do Qt).
[General]
fundo=
# Como a figura ocupa uma tela de outra proporção: espelho, desfoque, cor ou
# cobrir. Vem do JANGADA_PAPEL_AJUSTE.
ajuste=espelho
cor_tela=#141311
cor_caixa=#f2211f1d
cor_texto=#e6e2de
cor_destaque=#e6d9be
cor_selecao=#c9bda3
cor_texto_selecao=#37301d
cor_borda=#e6d9be
cor_erro=#ffb4ab
fonte=JetBrainsMono Nerd Font
# Tamanho da fonte em pontos numa tela de 1080 linhas; cresce na mesma
# proporção em telas maiores.
tamanho=12
